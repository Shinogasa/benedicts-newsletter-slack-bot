name: test

on:
  pull_request:
  push:
    branches: [main]

# テストを走らせるだけなので、リポジトリの読み取り権限に絞る
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # タグの付け替えで中身が変わらないよう、アクションはコミットSHAで固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
